name: Deploy all sites to Firebase Hosting
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGENTIC_SITES }}' > "$RUNNER_TEMP/gcp-key.json"
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project agentic-sites-d84eb --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/gcp-key.json"
